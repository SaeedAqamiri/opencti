  ai-llm.ts:
    summary: >-
      PRODUCT BUG FIXED in ai-llm.ts streaming: both paths (Mistral ~line 134
      'chunk.data.choices[0].delta.content' and OpenAI queryChatGpt ~line 174
      'chunk.choices[0]?.delta.content') guarded with '!== undefined', but gateways like avalai
      (LiteLLM/Fireworks passthrough) send delta.content=null on role/keep-alive chunks → JS
      'content += null' coerces to literal 'null' string, corrupting every AI text output
      ('nullnullnull…' prefixes; benchmark no-null-garbage failed 18/18). Fix: guard with '!= null'
      in BOTH paths. First fix round only patched the Mistral site — score stayed 0.58 with nulls
      18/18 until the OpenAI site was patched too (then 0.97). Lesson: type=openai uses
      queryChatGpt; always fix both sites and verify via benchmark, not build success.
    confidence: verified
