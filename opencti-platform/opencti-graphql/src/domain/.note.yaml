  stixCoreObject.js:
    summary: >-
      AI insights resolvers: aiActivity (threats=[Threat-Actor-*,Intrusion-Set,Campaign,Malware];
      victims=locations/sectors) returns {result, trend} where trend only for threats; aiForecast
      returns {result, updated_at} - the AiForecast GraphQL type HAS a confidence field but the
      resolver NEVER sets it (always null - product gap, benchmark phase 5 check 'valid-confidence'
      intentionally fails); aiHistory summarizes the last 200 audit logs of the entity; all cached
      in aiResponseCache for AI_INSIGHTS_REFRESH_TIMEOUT minutes. Container digest = aiSummary in
      domain/container.js: takes search/filters args, fetches up to 10 containers via
      topEntitiesList (platform full-text search - not exact match), builds content from
      description+files+getContainerKnowledge knowledge sentences.
