  ai-resolver.ts:
    summary: >-
      ai-resolver.ts registers only 10 mutation resolvers: aiContainerGenerateReport,
      aiSummarizeFiles, aiConvertFilesToStix, aiFixSpelling, aiMakeShorter, aiMakeLonger,
      aiChangeTone, aiSummarize, aiExplain, aiNLQ. The SDL also DECLARES aiThreatGenerateReport,
      aiVictimGenerateReport, aiConvertIndicator, aiImproveWriting (ai.graphql lines 33-42) but NO
      resolver exists in this checkout - calling them returns null silently. Therefore the
      agent_reports benchmark phase 10 measures the AGENT-side replacements instead.
