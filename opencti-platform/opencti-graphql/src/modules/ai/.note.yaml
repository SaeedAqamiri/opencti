  ai-domain.ts:
    summary: >-
      AI domain on ai-ungate: all EE gates removed except deprecated summarizeFiles:218 and
      convertFilesToStix:278. filtersEntityIdsMapping resolver upgraded (phase 4):
      resolveValuesIdsMapForEntityTypes for Stix-Core-Object tries (a) exact 'name' filter query,
      (b) 'aliases' filter query (merged entities keep old names as aliases only — e.g. APT29 lives
      as UNC2452 after import upsert), (c) full-text _score with preferExactNameMatch helper (exact
      name + non-revoked preference). Without this, OTX reports mentioning 'APT28' hijack
      resolution.
    based_on:
