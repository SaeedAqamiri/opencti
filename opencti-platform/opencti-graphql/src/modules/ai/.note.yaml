  ai-resolver.ts:
    summary: >-
      UPDATED 2026-09-20 (older 'no resolver' note is stale): ai-resolver.ts:49-51 now registers
      aiThreatGenerateReport/aiVictimGenerateReport -> generateEntityReport and aiConvertIndicator
      -> convertIndicator (ai-domain.ts:273/308), grounded on fullEntitiesThroughRelationsToList /
      storeLoadById; auth KNOWLEDGE_KNUPDATE, no EE gate. First arg `id` is the AI bus id (uuid from
      client), NOT an entity id — entity goes in threatId/victimId/indicatorId (String!). Backend
      defaults: paragraphs=8, tone=Tactical, format=Html; strips ``` fences. IndicatorFormat enum =
      stix|sigma|yara only.
    confidence: verified
