entries:
  TopBar.tsx:
    summary: >-
      TopBar handleSearch gates NLQ behind EE: `if (askAI && isEnterpriseEdition)` → nlqSearch, else
      plain handleSearchByKeyword. With an expired/invalid EE license (license_validated=false) the
      UI NLQ toggle still activates (SearchInput isAIEnabled uses useAI enabled&&configured) but
      pressing Enter silently falls back to keyword search — aiNLQ never hits the wire. Discovered
      live 2026-09-19 via control experiment: NLQ-mode and plain-mode produce identical URLs (both
      get the search page's own empty default 'Entity type=' filters query param — that chip is NOT
      NLQ evidence). Backend aiNLQ itself works ungated (benchmark-verified); fix = drop the
      isEnterpriseEdition condition in TopBar:194.
    based_on:
      - opencti-platform/opencti-front/src/private/components/nav/TopBar.tsx@16051-1789313542651
      - opencti-platform/opencti-front/src/components/SearchInput.jsx@19410-1789566097975
