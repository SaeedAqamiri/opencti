      useApiMutation with id=uuid() bus id, entityId -> threatId/victimId, format:'text' so the
      <pre> shows readable plain text (backend default html renders as markup). Props
      variant='toggle' toggles dialog open/close, 'button' (default) always opens. No EE gating by
      design.
