  EntityAiReportButton.tsx:
    summary: >-
      EntityAiReportButton (added 2026-09-20): reusable 'Generate AI report' trigger + options
      Dialog (FDS Select paragraphs 4/8/12 default 8, tone tactical/operational/strategic default
      tactical) + result Dialog (scrollable <pre> + Copy via copyToClipboard(t_i18n, text)). Commits
