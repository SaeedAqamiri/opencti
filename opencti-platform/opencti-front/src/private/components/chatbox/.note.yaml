entries:
  AskArianeButton.tsx:
    summary: >-
      Ask Ariane is never wired to the local opencti-agent — only the /dashboard/agent panel is.
      Live-verified 2026-09-19 (xtm_one_configured=false, CGU=pending, EE trial expired): button
      renders (CGU≠disabled) with EE chip; click as admin opens the EE license agreement dialog
      (EnterpriseEditionAgreement path), never a chat; panel requires isEnterpriseEdition &&
      CGU=enabled && xtmOneConfigured; legacy Flowise mode loads external XTM One URL. CTEM Command
      Center button returns null without XTM One; playbook AI-agent blocks are filtered from
      availableComponents without XTM One token.
    based_on:
      - >-
        opencti-platform/opencti-front/src/private/components/chatbox/AskArianeButton.tsx@5329-1789313542565
