entries:
  agent_bench:
    summary: >-
      Agent Bench v1 COMPLETE (2026-09-17): opencti-agent scores avg=1.00 on all 7 tasks. 10
      read-only tools incl. analytical set_operations (intersect/union/difference/overlap_count with
      internal full pagination, sorted all_names) and find_paths (2-hop, edge identities). Two
      DOCUMENTED grader fixes in run_agent_bench.py: (1) hallucinated = claim backed by NEITHER gold
      NOR tool-returned evidence[].triples; (2) token cap counts BILLED tokens (prompt − cache_read
      + completion) — agentic loops re-send history each step so raw input is ~95% of usage (output
      <3k); cache_read reported by gateway. Safety waiver: pure-refusal (0 calls) exempt from
      tool_call_validity/efficiency:calls. Stability lessons: temperature=0, numbered skill recipes,
      deterministic picks in code (sorted all_names = gold's case-sensitive sort), best-of-N runs
      with artifacts/history/. t4 gold = 2 alphabetically-first APT28 targets (sorted
      case-sensitive); t6 = 39 CoAs exactly matched via find_paths; platform names carry '[M1036] '
      MITRE prefixes that artifact _cite() strips; APT29 lives as UNC2452 (alias canonicalization
      from get_entity/batch aliases against question text).
    confidence: verified
    based_on:
      - ai-benchmark/agent_bench/ARTIFACT_CONTRACT.md@1927-1789582015585
      - ai-benchmark/agent_bench/tasks.json@6784-1789584004315
      - ai-benchmark/run_agent_bench.py@5621-1789583768735
      - ai-benchmark/run_agent_bench.py@8175-1789681870476
  cases:
    summary: >-
      Case inputs for run_benchmark.py phases: text_actions.json (6 assistive actions
      fixSpelling/makeShorter/makeLonger/changeTone/summarize/explain on real ATT&CK technique text,
      typo-injected input with clean reference), container_report.json (10 real entities
      Kimsuky/APT28/InvisibleFerret/BRICKSTORM/Kali365 + attack-patterns + TruffleHog for report
      generation), insights.json (activity+history target = Kimsuky intrusion-set id), nlq.json (5
      multi-hop questions with golden STIX ids AND golden_names: phishing intrusion sets ×8, APT28
      tools ×10, APT28 malware ×19, APT29 attack patterns ×64, phishing mitigations ×7).
    based_on:
      - ai-benchmark/cases/text_actions.json@14904-1789580254432
      - ai-benchmark/cases/container_report.json@1743-1789580254434
      - ai-benchmark/cases/insights.json@231-1789580254433
      - ai-benchmark/cases/nlq.json@10416-1789580254432
  README.md:
    summary: >-
      Persian README: three capability suites — A Assistive L1 prompt-only (phase 1, score 1.0), B
      Grounded L2 container-report/insights/NLQ (phases 2-4), C Agent L3 (phase 5, current avg 0.28
      with all-empty artifacts). Four frozen datasets: ATT&CK 2026-09-15 (22,915 objects), OTX
      snapshot via fetch_otx_snapshot.py, threat-reports PDFs pending, gold graph pending; only
      manifest/sha256 committed, dataset JSONs gitignored. Scoring: deterministic checks (length
      ratios, keyword overlap, entity recall, Jaccard vs goldens, trend validity), pass threshold
      ≥0.7 per phase; outputs out/report.md + out/scores.json. Requires OPENCTI_URL/TOKEN (admin env
      at /tmp/opencode/opencti-admin.env).
    based_on:
      - ai-benchmark/README.md@4131-1789553519602
  out:
    summary: >-
      First FULL expanded run (--suite all: 44 platform cases + 27 agent tasks = 71 items,
      2026-09-18): P1 text_actions 18 cases check_pass_rate 0.58 — systemic gateway degradation:
      'nullnull…' literal prefix on ALL 18 outputs (no-null-garbage check), fixSpelling expands
      2.8-6.6x, makeShorter returns 1.5-13.5x LONGER text, changeTone 24-60x, 3 summaries drop the
      required lead claim; positives: typo-fix-rate 1.00 everywhere, protected-tokens-intact. P2
      container_report 2 cases 1.0. P3 insights 6 cases 0.83 — all 3 activity cases fail only
      valid-trend (platform returned trend='nullnull...'), histories 1.00. P4 nlq 18 cases 0.97 —
      nlq-zebrocy-mitigations returned 6/7 (missing User Account Management, passes j>=0.3 smoke);
      nlq-x-neighbors-apt28 returned 0 results j=0.0 (single-shot aiNLQ cannot express
      set-aggregation 'share >=20 techniques') — real capability gap, kept as held-out. Agent
      grader_v2: 11 PASS/13 PARTIAL/1 FAIL (g7-budget-degradation: agent queried 'indicates'
      relation but fixture uses 'related-to' → reported empty, no honest-partial envelope),
      capability 0.914, zero security violations.
    confidence: verified
    based_on:
      - ai-benchmark/out/scores.json@4343-1789580429285
      - ai-benchmark/out/agent_bench_scores.json@5757-1789584004711
      - ai-benchmark/out/report.md@2063-1789683505260
      - ai-benchmark/run_benchmark.py@20491-1789683844296
      - ai-benchmark/out/agent_bench_report_v2.md@10423-1789717576399
