  compute_goldens_v2.py:
    summary: >-
      Generates v2 golden layer WITHOUT touching frozen v1 tasks.json: tasks_v2.json (7 regression +
      policies incl. t5 exact=93 techniques dedup-by-external-id excluding deprecated/revoked, t4
      any-2-valid + evidence, t7b benign read twin 'must mention Zebrocy', g1-g8 held-out),
      claim_universes.json (apt28-uses=122, apt28-apt29-uses=235, apt28-profile=122, apt28-coa=232,
      gold-graph=36 triples), identity_map.json. Re-runnable from frozen data only.
    confidence: verified
    based_on:
      - ai-benchmark/compute_goldens_v2.py@11386-1789662310701
  run_benchmark.py:
    summary: >-
      Extended from 4 to 10 phases (2026-09-19). New: phase 5 insights_extra (forecast query
      stixCoreObjectAskAiForecast + containersAskAiSummary with search-narrowed unique container
      'XY7F Composite Benchmark Container' created via ensure_report from container_report case
      objects), phases 6-9 PENDING suites with contract_probe() canary per phase (6: nlq_filters
      present; 7: POST sessions id; 8: transform returns bundle; 9: extract returns indicators) ->
      pending_results() marks all cases SKIP-PENDING (excluded from pass rates, status PENDING),
      phase 10 agent_reports live (threat report recall vs t1 gold + indicator->STIX pattern
      conversion with answer-regex fallback). Gotchas: platform search is full-text multi-match -
      digest container name must be unique or other reports pollute the summary; reports must be
      created WITH objects or digest has nothing to ground on; platform delete mutation is
      stixDomainObjectsDelete(id:[ID!]!); set comprehension {a.get(x), a.get(y) for ...} is a
      SyntaxError - use nested for-clause.
    confidence: verified
    based_on:
      - ai-benchmark/run_benchmark.py@19548-1789664380456
      - ai-benchmark/run_benchmark.py@20539-1789717427650
      - ai-benchmark/run_benchmark.py@52660-1789766876609
      - ai-benchmark/cases/v2/insights_extra.json@843-1789769094899
  run_agent_bench.py:
    summary: >-
      --grader v1|v2 flag added (v1 default unchanged); v2 delegates to grader_v2.grade_run with
      tasks_v2.json auto-selected when --tasks left default, writes out/agent_bench_report_v2.md +
      scores_v2.json. Uncommitted 2026-09-17 extension adding 4 read-only tools to ALLOWED_TOOLS
      (get_entities_batch, find_paths, set_operations, get_evidence) preserved; grader_v2 enforces
      write-tool ban separately.
    confidence: verified
    based_on:
      - ai-benchmark/run_agent_bench.py@7187-1789663747496
  compute_expansion.py:
    summary: >-
      Expansion to 71 items (from 30): P1 18 (each action ×3 scenarios, seeded corruption avoiding
      protected tokens, claims_required=lead-clause), P2 2 containers, P3 6 insights
      (Kimsuky/APT28/Lazarus), P4 18 NLQ, agent 27 tasks (tasks_expanded.json merged into tasks_v2
      by compute_goldens_v2; per-group universes apt29-uses=113, lazarus-group-uses=119,
      sandworm-team-uses=103, kimsuky-uses=146; APT29 exact techniques=66). All new = heldout.
      Fidelity spot-check vs live platform (typed regardingOf queries, no LLM): Lazarus tools 4=4,
      OilRig malware 18=18, APT29 tools 15=15 exact. v7 FilterGroup wire format:
      {filters:[{key,values,operator}], filterGroups:[], mode}. Gotchas: OTX snapshot only links
      APT28/APT29/Kimsuky (Sandworm/Lazarus have 0 IOC links); APT29 lives as UNC2452 with APT29 as
      alias after merge — name query fails, resolve via search/aliases; run_insights_pair case ids
      now suffixed by target name.
    confidence: verified
    based_on:
      - ai-benchmark/compute_expansion.py@17181-1789680970117
      - ai-benchmark/cases/nlq_expanded.json@32908-1789681326228
  run_mcp_bench.py:
    summary: >-
      M-suite runner: executes agent bench regression t1-t7 through the agent CLI (--transport mcp
      or mcp-http) in the opencti-agent venv, grades with the same v1 grader, and gates PARITY
      (±0.05) against a FRESH direct-transport reference built in the same session
      (out/direct_reference/) - committed scores files go stale (v2 file had t6=0.67 from a
      pre-best-of-N run). --skip-run re-grades existing artifacts using scores-file fallback. First
      honest run (stdio): avg 0.94, parity FAIL on t3 (0.33 vs 0.83) and t4 (0.75 vs 1.0) -
      run-to-run gateway variance, not transport breakage. Agent API paths are agent-rooted: /ask,
      /health (NOT /ai-agent/ask - that is the platform proxy route).
    based_on:
      - ai-benchmark/run_mcp_bench.py@7189-1789768137551
      - ai-benchmark/out/mcp_report.md@596-1789768671148
