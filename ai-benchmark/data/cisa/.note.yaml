summary: >-
  Frozen CISA advisory dataset (public domain, fetched 2026-09-19): AA23-347A (SVR/TeamCity, 47,886
  chars, 33 IOCs + 35 ATT&CK techniques) and AA22-320A (Iranian/VMware, 19,802 chars, 6 IOCs + 16
  techniques). Gold IOCs parsed from the OFFICIAL CISA STIX 1.2 XML files (data/cisa/raw/*.stix.xml,
  committed); technique gold = regex on frozen text. Rebuild must be byte-identical
  (build_cisa_gold.py asserts). IOC values are defanged in advisory text ([.]/hxxps) - lib.refang()
  normalizes model output before comparison; hallucination is judged against gold ∪ IOC-shaped
  values present in the source text (grounding universe).
